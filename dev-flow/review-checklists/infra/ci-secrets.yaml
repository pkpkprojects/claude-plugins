name: CI/CD pipeline and secrets handling
version: "1.0"
applies_when: {}
severity_default: HIGH

checks:
  - id: INFRA-SEC-01
    area: "No secrets in repo or plaintext config"
    question: "Are there any secrets (API keys, passwords, tokens, private keys) committed to the repository, in image layers, or written into a job spec/manifest in plaintext?"
    severity: CRITICAL
    kind: rule
    hints:
      - "Grep the diff for patterns like key=, token=, password=, BEGIN PRIVATE KEY, or long high-entropy strings"
      - "Check Dockerfile ARG/ENV instructions for anything that looks like a credential"
      - "Check orchestrator job/manifest files for inline secret values instead of references"
    remediation: "Remove the secret from the repo/image/manifest and rotate it immediately, since it is now compromised. Inject secrets at runtime from a secret manager (Vault, cloud KMS, or the orchestrator's native secrets feature) instead."

  - id: INFRA-SEC-02
    area: "Secrets not exposed via build args or CI logs"
    question: "Are secrets kept out of Docker build args (visible in image history) and out of CI log output (no accidental echo/print of a secret value)?"
    severity: CRITICAL
    kind: rule
    hints:
      - "Check Dockerfile for ARG used to pass a secret into build (ends up in image history)"
      - "Check CI scripts for commands that could print an env var containing a secret (e.g. printenv, echo $SECRET, set -x near secret usage)"
    remediation: "Use build-time secret mounts (e.g. BuildKit --secret) instead of ARG/ENV for anything sensitive. Avoid shell tracing (set -x) around secret-handling steps, and never echo a secret-bearing variable."

  - id: INFRA-SEC-03
    area: "Secrets injected at runtime, not baked in"
    question: "Are secrets injected into the running service at deploy/runtime (env var from a secret manager, mounted secret file) rather than baked into the built artifact?"
    severity: CRITICAL
    kind: rule
    hints:
      - "Check if the Dockerfile or build step embeds a credential directly into the image"
    remediation: "Bake nothing sensitive into the image. Inject secrets at container start via the orchestrator's secret-injection mechanism, sourced from a secret manager."

  - id: INFRA-SEC-04
    area: "New secret follows the documented secret chain"
    question: "Is a newly introduced secret added through the project's documented secret management flow, rather than as an ad-hoc environment variable set by hand on a server or in CI settings?"
    severity: HIGH
    kind: policy
    hints:
      - "Check for a new env var/secret reference with no corresponding entry in the project's secret management tooling/docs"
      - "Look for a manually-set CI secret or server-side env var introduced only in this change without an accompanying update to the secret chain"
    remediation: "Add the secret through the project's documented secret management process (vault entry, secret manager path) so it is tracked, rotatable, and consistent across environments, instead of a one-off manual env var."

  - id: INFRA-SEC-05
    area: "Least privilege for injected secrets/credentials"
    question: "Does the credential granted to this service/pipeline have the minimum scope it needs (not a broad/admin credential used for convenience)?"
    severity: HIGH
    kind: policy
    hints:
      - "Check the scope/role attached to a service account, API key, or DB user introduced in this change"
    remediation: "Scope the credential down to only the resources/actions the service actually needs. Create a dedicated least-privilege credential instead of reusing a broad one."

  - id: INFRA-SEC-06
    area: "Rotation path exists"
    question: "Is there a documented or automated way to rotate this credential without a manual, error-prone, multi-step process?"
    severity: MEDIUM
    kind: policy
    hints:
      - "Check the secret manager entry or docs for a rotation procedure"
    remediation: "Document (or automate) the rotation procedure: issue new credential, update the secret store, restart/reload affected services, revoke the old credential."

  - id: INFRA-SEC-07
    area: "PR builds from forks don't get repo secrets"
    question: "Does the CI configuration avoid exposing repository secrets to workflows triggered by pull requests from forks?"
    severity: CRITICAL
    kind: rule
    hints:
      - "Check CI workflow triggers (e.g. pull_request vs pull_request_target) and whether secrets are available in fork-triggered runs"
    remediation: "Use the trigger type that does not expose secrets to fork PRs by default (e.g. pull_request, not pull_request_target, for untrusted code), or explicitly gate secret-using steps behind a maintainer-approval step."

  - id: INFRA-SEC-08
    area: "Pinned action/image versions"
    question: "Are third-party CI actions and base images pinned to a specific version or digest, rather than a floating tag like @main or @latest?"
    severity: HIGH
    kind: rule
    hints:
      - "Check workflow files for 'uses: owner/action@main' or unpinned tags"
      - "Check image references for missing/floating tags"
    remediation: "Pin third-party actions to a commit SHA or specific release tag, and images to a specific version or digest. A floating reference can silently pull in malicious or breaking changes."

  - id: INFRA-SEC-09
    area: "Lint/test gates cannot be bypassed"
    question: "Is it impossible to merge/deploy without the required lint and test checks passing (no --no-verify path baked into the pipeline, no way to force-merge past a required check)?"
    severity: HIGH
    kind: rule
    hints:
      - "Check CI config for a step that swallows test failures (continue-on-error on a required gate, || true on the test command)"
      - "Check branch protection / merge rules if visible in the repo config"
    remediation: "Remove any continue-on-error or failure-swallowing on required checks. Require status checks to pass before merge at the branch-protection/repo level."

  - id: INFRA-SEC-10
    area: "Reproducible builds"
    question: "Does the build pin its dependency versions (lockfile committed and used) so the same source produces the same artifact across runs?"
    severity: MEDIUM
    kind: policy
    hints:
      - "Check for a lockfile (package-lock.json, poetry.lock, go.sum, etc.) and whether the build actually uses it (npm ci vs npm install)"
    remediation: "Commit and use the dependency lockfile in CI (e.g. npm ci instead of npm install) so builds are reproducible and not silently drifting between runs."

  - id: INFRA-SEC-11
    area: "Dependency/SBOM scan policy"
    question: "Does the project have a stated policy on dependency vulnerability scanning and SBOM generation (even if the policy is 'not required yet'), rather than an unstated default?"
    severity: LOW
    kind: policy
    hints:
      - "Check for a dependency scan step in CI, or a documented decision not to have one yet"
    remediation: "Add a dependency vulnerability scan step to CI, or explicitly document the decision to defer this and why, so it's a conscious tradeoff rather than an oversight."
